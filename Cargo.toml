[workspace]
resolver = "2"
members = ["crates/fs-settings-server", "crates/fs-settings-bin"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy-Net/fs-settings"
# fs-rpc and fs-components need 1.89.
rust-version = "1.89"

# One source per library (ADR 0092). All pins are tags of the org FreeSynergy-Net.
[workspace.dependencies]
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", tag = "v0.0.10", features = ["v5"] }
fs-settings = { git = "https://github.com/FreeSynergy-Net/fs-components", tag = "v0.0.35" }
fs-settings-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", tag = "v0.1.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", tag = "v0.1.0" }
# Same source as the `conformance` feature of fs-settings (B1) pins; the pins must stay equal (one source per library, ADR 0092).
fs-conformance = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6" }
capnp = "0.27"
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"

