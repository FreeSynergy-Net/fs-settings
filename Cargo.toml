[workspace]
resolver = "2"
members = ["crates/fs-settings-server", "crates/fs-settings-bin"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-settings"
# fs-rpc and fs-components need 1.89.
rust-version = "1.89"

# One source per library (ADR 0092). PROVISIONAL (probe C, trait-delta fs-settings-store): the three `branch` pins point at the
# probe branches of parts A and B1/B2 and are replaced by `rev = <head>` (probe compile) and then by tags (cascade, ENTWURF section R).
[workspace.dependencies]
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.1" }
# Part A: `v5::setting` (SettingRows, Store::inspect, Error::Newer). Branch pin, provisional.
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", rev = "8adc1e8fe837dc159e2490172fcbe5d6c89c6a69", features = ["v5"] }
# Part B1: the port (SettingsStore, InstanceStore, codes, StoreSuite). Package `fs-settings` of the repo fs-components. Branch pin, provisional.
fs-settings = { git = "https://github.com/FreeSynergy/fs-components", rev = "e06631191fb20f3de63cdc5d9e977b2398eefac0" }
# Part B2: client, server skeleton, `ensure_service`. Branch pin, provisional.
fs-settings-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", rev = "a32251e9daf00c69da69316bfd51c686781819cc" }
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", rev = "a32251e9daf00c69da69316bfd51c686781819cc" }
# Same source as the `conformance` feature of fs-settings (B1) pins; the pins must stay equal (one source per library, ADR 0092).
fs-conformance = { git = "https://github.com/FreeSynergy/fs-types", rev = "339aa24fa61bc8e6c39ea7875d826ec6993cd24f" }
capnp = "0.27"
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"

# LOCAL ONLY (not committed): one fs-settings for me and for B2 (which still pins B1 10985aaf)
[patch."https://github.com/FreeSynergy/fs-components"]
fs-settings = { path = "../psC-b1/crates/fs-settings" }
