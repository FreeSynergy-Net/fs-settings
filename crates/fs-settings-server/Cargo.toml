[package]
name = "fs-settings-server"
description = "FreeSynergy Settings, the service: the settings database behind the port of fs-settings, emergency mode, repair, exchange (TOML/JSON) and the one-time legacy import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The suite `store` of fs-settings over the database (K-case KC16). Never default: fs-conformance stays out of the normal graph.
conformance = ["fs-settings/conformance", "dep:async-trait", "dep:fs-conformance"]

[dependencies]
fs-types.workspace = true
fs-objects.workspace = true
fs-settings.workspace = true
fs-settings-rpc.workspace = true
fs-rpc.workspace = true
capnp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
async-trait = { version = "0.1", optional = true }
fs-conformance = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Already in the graph through fs-settings-rpc (`getuid`); the process feature only.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures = "0.3"
