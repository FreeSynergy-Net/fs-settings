[package]
name = "fs-settings-bin"
description = "FreeSynergy Settings: the command `fs-settings` (serve, instance, export, import, repair)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-settings"
path = "src/main.rs"

# The file name of the module service (`<modules>/settings/service`), the same code as `fs-settings`.
[[bin]]
name = "service"
path = "src/service.rs"

[dependencies]
fs-settings-server = { path = "../fs-settings-server", version = "0.0.1" }

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "ad56e2f4b953ebf51d41bb7aec8202dfafebdfac", version = "0.2.0" }
serde_json.workspace = true
tempfile.workspace = true
fs-settings.workspace = true
fs-settings-rpc.workspace = true
fs-rpc.workspace = true
fs-types.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros"] }
